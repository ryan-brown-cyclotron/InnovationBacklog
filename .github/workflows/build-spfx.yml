name: Build SPFx Package

on:
  push:
    branches: [main]
    paths:
      - "src/Momentum.Frontend/apps/spfx/**"
      - "src/Momentum.Frontend/packages/**"
      - ".github/workflows/build-spfx.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/Momentum.Frontend/apps/spfx/**"
      - "src/Momentum.Frontend/packages/**"
      - ".github/workflows/build-spfx.yml"
  workflow_dispatch:

concurrency:
  group: spfx-build-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm
          cache-dependency-path: src/Momentum.Frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: src/Momentum.Frontend
        run: pnpm install --frozen-lockfile

      - name: Restore .NET tools (TypeGen)
        run: dotnet tool restore

      - name: Build contracts package
        working-directory: src/Momentum.Frontend
        run: pnpm --filter @momentum/contracts build

      - name: Build SDK package
        working-directory: src/Momentum.Frontend
        run: pnpm --filter @momentum/sdk build

      - name: Build UI package
        working-directory: src/Momentum.Frontend
        run: pnpm --filter @momentum/ui build

      - name: Copy SCSS to UI dist
        working-directory: src/Momentum.Frontend/packages/ui
        run: |
          find src -name "*.scss" | while read f; do
            dest="dist/${f#src/}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done

      - name: Build SPFx solution
        working-directory: src/Momentum.Frontend/apps/spfx
        run: |
          npx gulp clean
          npx gulp build
          npx gulp bundle --ship
          npx gulp package-solution --ship || true

      - name: Verify package exists
        working-directory: src/Momentum.Frontend/apps/spfx
        run: |
          ls -la sharepoint/solution/*.sppkg

      - name: Upload .sppkg artifact
        # Publish the package on every run (pushes, PRs, manual), even if the
        # deploy job will be skipped for this event.
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: momentum-spfx-sppkg
          path: src/Momentum.Frontend/apps/spfx/sharepoint/solution/*.sppkg
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to tenant app catalog
    needs: build
    # Deploy only on pushes to main or manual runs, never on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: sharepoint-production
    permissions:
      contents: read

    steps:
      - name: Download .sppkg artifact
        uses: actions/download-artifact@v4
        with:
          name: momentum-spfx-sppkg
          path: package

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CLI for Microsoft 365
        run: npm install --global @pnp/cli-microsoft365

      - name: Sign in using certificate
        env:
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
          CERTIFICATE_ENCODED: ${{ secrets.CERTIFICATE_ENCODED }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${CERTIFICATE_ENCODED}" | base64 -d > cert.pfx
          m365 login \
            --authType certificate \
            --appId "${ENTRA_CLIENT_ID}" \
            --tenant "${ENTRA_TENANT_ID}" \
            --certificateFile ./cert.pfx \
            --password "${CERTIFICATE_PASSWORD}"
          rm -f cert.pfx
          m365 status

      - name: Upload and deploy package
        env:
          TENANT_WIDE: ${{ vars.SPFX_TENANT_WIDE }}
        run: |
          set -euo pipefail

          mapfile -t PACKAGES < <(find package -maxdepth 1 -type f -name '*.sppkg')

          if [[ "${#PACKAGES[@]}" -ne 1 ]]; then
            echo "Expected exactly one .sppkg file, found ${#PACKAGES[@]}."
            exit 1
          fi

          PACKAGE_PATH="${PACKAGES[0]}"
          PACKAGE_NAME="$(basename "${PACKAGE_PATH}")"

          echo "Uploading ${PACKAGE_NAME} to the tenant app catalog..."
          m365 spo app add \
            --filePath "${PACKAGE_PATH}" \
            --overwrite

          echo "Deploying ${PACKAGE_NAME}..."
          if [[ "${TENANT_WIDE:-false}" == "true" ]]; then
            m365 spo app deploy \
              --name "${PACKAGE_NAME}" \
              --skipFeatureDeployment
          else
            m365 spo app deploy \
              --name "${PACKAGE_NAME}"
          fi

          echo "Deployment completed."

      - name: Sign out
        if: always()
        run: m365 logout || true
